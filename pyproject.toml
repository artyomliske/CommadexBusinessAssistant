[project]
name = "repairbot"
version = "0.1.0"
description = "Мультиагентная система для компании по ремонту квартир"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "structlog>=24.4",
    "tenacity>=9.0",
    "sentry-sdk>=2.19",
    "anthropic>=0.116",
    # Транспорт google-auth требует requests, сам его не тянет.
    "google-auth[requests]>=2.37",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
# Разовая авторизация в аккаунте заказчика (repairbot google-authorize).
# Открывает браузер, поэтому на сервере не нужна: там достаточно готового
# файла токена, который читается штатным google-auth.
setup = ["google-auth-oauthlib>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repairbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    # Правила ищут латиницу, замаскированную под кириллицу. Проект
    # намеренно написан по-русски: комментарии, строки и docstring'и
    # содержат кириллицу законно, и правило срабатывает на каждой «а».
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
