# Прокси для выхода наружу. Минимальный: пропускает только то, что нужно.

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm repairbot
auth_param basic credentialsttl 6 hours

acl authenticated proxy_auth REQUIRED

# Куда вообще разрешено ходить. Список закрытый, а не открытый: если
# кто-то доберётся до прокси, он не сможет пользоваться им как открытым.
acl allowed_hosts dstdomain .openrouter.ai
acl allowed_hosts dstdomain .anthropic.com
acl allowed_hosts dstdomain .googleapis.com
acl allowed_hosts dstdomain .google.com
acl allowed_hosts dstdomain .telegram.org

# CONNECT нужен для HTTPS. Разрешаем только на 443, чтобы прокси нельзя
# было использовать для рассылки почты или сканирования портов.
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !authenticated
http_access deny CONNECT !SSL_ports
http_access allow authenticated allowed_hosts
http_access deny all

# Адрес обязателен. Без него squid выбирает семейство сам и в этом
# контейнере занял только IPv6 — а docker-proxy пробрасывает соединения
# по IPv4, и каждое отвергалось мгновенно. Снаружи это выглядело как
# «прокси не отвечает», хотя squid был жив и порт слушал.
http_port 0.0.0.0:3128

# Кэш не нужен: через прокси идут запросы к API, а не статика.
cache deny all

# Запросы в журнал не пишем: через прокси проходят ключи и
# персональные данные, и складывать их на диск незачем. Это про
# access_log — там адреса и параметры.
access_log none

# А вот cache_log — это сообщения самого squid: почему не разобрал
# конфигурацию, почему не смог запуститься. Раньше здесь стояло
# /dev/null «за компанию», и squid умер молча: контейнер числился
# живым, порт слушал docker-proxy, а причина уходила в никуда.
# Пишем в стандартный вывод, чтобы она попадала в `docker compose logs`.
cache_log /dev/stdout
